[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forceequals-skills"
version = "0.1.0"
description = "Installs the ForceEquals governance skill into the current repository."
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.scripts]
forceequals-skills = "forceequals_skills:main"

[tool.setuptools.packages.find]
include = ["forceequals_skills*"]
